services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mrc_dev
      POSTGRES_USER: mrc
      POSTGRES_PASSWORD: mrc
    ports:
      - "5432:5432"
    volumes:
      - mrc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrc -d mrc_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mrc_postgres_data:
